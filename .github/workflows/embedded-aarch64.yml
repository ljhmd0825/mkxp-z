name: Manual Embedded aarch64 Build

on:
  workflow_dispatch: # Actions 탭에서 수동으로 버튼을 눌러 실행합니다.

jobs:
  build-aarch64-focal:
    name: Ubuntu 20.04 aarch64 (Embedded)
    runs-on: ubuntu-latest
    container: ubuntu:20.04 # GCC 9 및 Glibc 2.31 환경 강제
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 의존성 및 빌드 캐싱
      - name: Cache APT and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            linux/downloads
            linux/build-arm64
          key: build-cache-focal-arm64-${{ hashFiles('linux/Makefile', 'linux/target-arm64.sh') }}
          restore-keys: |
            build-cache-focal-arm64-

      # 2. APT 저장소 설정 및 도구 설치
      - name: Setup Multi-Arch Repositories
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. 기존 amd64 저장소는 유지하되, arm64 전용 ports 주소 추가
          # 기존 소스 리스트에서 amd64 아키텍처 명시
          sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          
          # arm64 패키지는 반드시 ports.ubuntu.com에서 받아야 합니다 (핵심)
          echo "deb [arch=arm64] http://ports.ubuntu.com/ focal main restricted universe multiverse" > /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ focal-updates main restricted universe multiverse" >> /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ focal-security main restricted universe multiverse" >> /etc/apt/sources.list.d/arm64.list
          
          # 2. 아키텍처 추가 및 업데이트
          dpkg --add-architecture arm64
          apt-get update
          
          # 3. CMake 최신 버전 설치 (file(CHMOD) 에러 해결용)
          apt-get install -y gpg wget
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main' > /etc/apt/sources.list.d/kitware.list
          apt-get update
          
          # 4. 필수 패키지 설치
          apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            git build-essential cmake meson autoconf automake libtool pkg-config ruby bison xxd \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            zlib1g-dev:arm64 libbz2-dev:arm64 libgl1-mesa-dev:arm64 libasound2-dev:arm64 \
            libpulse-dev:arm64 libx11-dev:arm64 libexpat1-dev:arm64 libdbus-1-dev:arm64

          # 5. Autoconf 2.71 설치 (Theora 등 대응)
          wget https://ftp.gnu.org/gnu/autoconf/autoconf-2.71.tar.gz
          tar -xzf autoconf-2.71.tar.gz && cd autoconf-2.71 && ./configure --prefix=/usr && make -j$(nproc) && make install
          cd .. && rm -rf autoconf-2.71*

      # 3. MKXP-Z 전용 라이브러리 빌드
      - name: Build External Libraries
        run: |
          cd linux
          [ -f target-arm64.sh ] && source target-arm64.sh || {
            export ARCH_MKXPZ=arm64
            export ARCH_GCC=aarch64-linux-gnu
            export MKXPZ_PREFIX=$GITHUB_WORKSPACE/linux/build-arm64
          }
          
          # PKG_CONFIG_PATH를 강제로 지정하여 CMake가 arm64용 expat과 dbus를 찾게 합니다.
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:$MKXPZ_PREFIX/lib/pkgconfig
          
          # 병렬 빌드(-j) 없이 순차 빌드로 의존성 순서를 보장합니다.
          make

      # 4. 최종 MKXP-Z 바이너리 컴파일
      - name: Build MKXP-Z Executable
        run: |
          # 환경 설정 재로드
          [ -f linux/target-arm64.sh ] && source linux/target-arm64.sh
          source linux/vars.sh
          
          # 기존 빌드 내역 삭제 후 재설정
          rm -rf build
          
          # 크로스 컴파일 파일을 사용하여 Meson 설정
          meson setup --cross-file linux/target-arm64.meson build --bindir=. --prefix=$GITHUB_WORKSPACE/build/local
          
          cd build
          ninja -j$(nproc)
          ninja install

      # 5. 빌드 결과물 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-focal-arm64-artifact
          path: build/local
