name: Build mkxp-z (arm64)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Linux arm64 cross compile (Ubuntu 20.04 via Docker)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mkxp-z
        uses: actions/checkout@v4
        with:
          repository: mkxp-z/mkxp-z
          ref: dev
          submodules: recursive

      # Makefile 전체 내용 출력 — 빌드 순서, 각 라이브러리 configure 옵션 확인용
      - name: Print linux/Makefile for inspection
        run: cat linux/Makefile

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            linux/downloads
            linux/build
          key: linux-arm64-deps-ubuntu20-${{ hashFiles('linux/Makefile') }}
          restore-keys: |
            linux-arm64-deps-ubuntu20-

      - name: Build dependencies (arm64 cross, inside ubuntu:20.04)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y \
                git \
                gcc g++ \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu \
                binutils-aarch64-linux-gnu \
                autoconf automake libtool \
                cmake \
                pkg-config \
                bison nasm \
                ninja-build \
                zlib1g-dev libbz2-dev \
                xorg-dev libgl1-mesa-dev \
                libasound2-dev libpulse-dev \
                python3 python3-pip \
                curl wget

              pip3 install --upgrade "meson>=0.56.0"

              git config --global http.postBuffer 524288000
              git config --global http.lowSpeedLimit 1000
              git config --global http.lowSpeedTime 60

              # autoconf 2.71 소스 빌드 (apt = 2.69, theora는 2.71 필요)
              cd /tmp
              curl -fsSL https://ftp.gnu.org/gnu/autoconf/autoconf-2.71.tar.gz | tar xz
              cd autoconf-2.71
              ./configure --prefix=/usr/local
              make -j$(nproc)
              make install
              autoconf --version | head -1

              # zlib을 aarch64용으로 먼저 직접 빌드해서 PREFIX에 설치
              # linux/Makefile의 libpng configure가 크로스 zlib을 못 찾는 문제 우회
              cd /tmp
              curl -fsSL https://zlib.net/zlib-1.3.1.tar.gz | tar xz
              cd zlib-1.3.1
              CC=aarch64-linux-gnu-gcc \
              CFLAGS="-O3" \
              ./configure \
                --prefix=/work/linux/build-arm64 \
                --static
              make -j$(nproc)
              make install

              cd /work
              source linux/target-arm64.sh
              cd linux
              make -j1
            '

      - name: Build mkxp-z (inside ubuntu:20.04)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y \
                gcc g++ \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu \
                binutils-aarch64-linux-gnu \
                cmake pkg-config \
                ninja-build \
                python3 python3-pip \
                zlib1g-dev libbz2-dev \
                xorg-dev libgl1-mesa-dev \
                libasound2-dev libpulse-dev

              pip3 install --upgrade "meson>=0.56.0"

              source linux/target-arm64.sh
              CROSS_FILE="${MESON_CROSS_FILE:-linux/meson-aarch64.txt}"

              meson setup build \
                --cross-file "$CROSS_FILE" \
                --buildtype=release \
                -Dappimage=false

              ninja -C build -j$(nproc)
            '

      - name: Verify output is aarch64 ELF
        run: |
          BIN=$(ls build/mkxp-z.aarch64 build/mkxp-z 2>/dev/null | head -1)
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class|Machine'
          readelf -h "$BIN" | grep -q 'AArch64' \
            && echo "✓ aarch64 confirmed" \
            || (echo "✗ unexpected arch!" && exit 1)

      - name: Package artifact
        run: |
          mkdir -p artifact/lib
          cp build/mkxp-z.aarch64 artifact/ 2>/dev/null || cp build/mkxp-z artifact/
          find linux/build/lib -name "*.so*" ! -type d 2>/dev/null \
            | xargs -I{} cp -Lv {} artifact/lib/ || true
          [ -d assets ] && cp -r assets artifact/ || true
          find artifact -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-linux-arm64-${{ github.sha }}
          path: artifact/
          retention-days: 30
