name: Build mkxp-z (arm64)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Linux arm64 cross compile (Ubuntu 20.04 via Docker)
    runs-on: ubuntu-22.04

    steps:
      # ── 1. 소스 체크아웃 (runner에서 — git 있음) ────────────────────
      - name: Checkout mkxp-z
        uses: actions/checkout@v4
        with:
          repository: mkxp-z/mkxp-z
          ref: dev
          submodules: recursive

      # ── 2. 의존성 캐시 ──────────────────────────────────────────────
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            linux/downloads
            linux/build
          key: linux-arm64-deps-ubuntu20-${{ hashFiles('linux/Makefile') }}
          restore-keys: |
            linux-arm64-deps-ubuntu20-

      # ── 3. 의존성 빌드 ───────────────────────────────────────────────
      - name: Build dependencies (arm64 cross, inside ubuntu:20.04)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y \
                git \
                gcc g++ \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu \
                binutils-aarch64-linux-gnu \
                autoconf automake libtool \
                cmake \
                pkg-config \
                bison nasm \
                ninja-build \
                zlib1g-dev libbz2-dev \
                xorg-dev libgl1-mesa-dev \
                libasound2-dev libpulse-dev \
                python3 python3-pip \
                curl wget

              pip3 install --upgrade "meson>=0.56.0"

              git config --global http.postBuffer 524288000
              git config --global http.lowSpeedLimit 1000
              git config --global http.lowSpeedTime 60

              source linux/target-arm64.sh
              cd linux
              # -j1 로 직렬 빌드 — ogg가 끝난 뒤 vorbis가 시작되도록
              # 병렬이면 ogg 빌드 전에 vorbis cmake가 먼저 실행되어 실패함
              make -j1
            '

      # ── 4. mkxp-z 본체 빌드 ─────────────────────────────────────────
      - name: Build mkxp-z (inside ubuntu:20.04)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -ex -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y \
                gcc g++ \
                gcc-aarch64-linux-gnu \
                g++-aarch64-linux-gnu \
                binutils-aarch64-linux-gnu \
                cmake pkg-config \
                ninja-build \
                python3 python3-pip \
                zlib1g-dev libbz2-dev \
                xorg-dev libgl1-mesa-dev \
                libasound2-dev libpulse-dev

              pip3 install --upgrade "meson>=0.56.0"

              source linux/target-arm64.sh
              CROSS_FILE="${MESON_CROSS_FILE:-linux/meson-aarch64.txt}"
              echo "Cross file: $CROSS_FILE"

              meson setup build \
                --cross-file "$CROSS_FILE" \
                --buildtype=release \
                -Dappimage=false

              # 본체 빌드는 병렬 OK
              ninja -C build -j$(nproc)
            '

      # ── 5. 바이너리 검증 ─────────────────────────────────────────────
      - name: Verify output is aarch64 ELF
        run: |
          BIN=$(ls build/mkxp-z.aarch64 build/mkxp-z 2>/dev/null | head -1)
          echo "Binary: $BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class|Machine'
          readelf -h "$BIN" | grep -q 'AArch64' \
            && echo "✓ aarch64 confirmed" \
            || (echo "✗ unexpected arch!" && exit 1)

      # ── 6. 아티팩트 패키징 ───────────────────────────────────────────
      - name: Package artifact
        run: |
          mkdir -p artifact/lib

          cp build/mkxp-z.aarch64 artifact/ 2>/dev/null \
            || cp build/mkxp-z artifact/

          find linux/build/lib -name "*.so*" ! -type d 2>/dev/null \
            | xargs -I{} cp -Lv {} artifact/lib/ || true

          [ -d assets ] && cp -r assets artifact/ || true

          echo "── artifact layout ──"
          find artifact -type f | sort

      # ── 7. 업로드 ───────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-linux-arm64-${{ github.sha }}
          path: artifact/
          retention-days: 30
